name: '📖 User Story'
description: A user-focused story describing a feature or capability
type: User Story
labels: ['needs triage :exclamation:']
title: '**enter the title of your user story here**'
body:
  - type: markdown
    attributes:
      value: |
        **Thanks for creating a user story!**
        Please use the "As a / I want / So that" format below to clearly describe the desired functionality.

  - type: textarea
    attributes:
      label: User story
      description: Describe the story using the standard format.
      placeholder: |
        As a [role],
        I want [capability],
        So that [benefit].
    validations:
      required: true

  - type: textarea
    attributes:
      label: Acceptance criteria
      description: |
        Testable conditions that must be met for this story to be considered done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Design / UI references
      description: Links to mockups, wireframes, or design specs.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Technical notes
      description: Implementation considerations, constraints, or relevant technical details.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional context
      description: Any other supporting information, screenshots, or links.
    validations:
      required: false
